name: CI

# Every push is checked. Deployment is gated on the repository's *default*
# branch rather than a hardcoded name, so renaming it never silently stops
# publishing — which is exactly what a hardcoded `main` did on day one.
on:
  push:
  pull_request:
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  verify:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fastest feedback first.
      - name: Types
        run: npm run check
      - name: Lint, formatting and design tokens
        run: npm run lint
      - name: Unit, property and component tests
        run: npm run test:coverage

  e2e:
    name: User journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end, accessibility and the monkey walk
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build and measure
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for GitHub Pages
        run: npm run build
        env:
          # A project site is served from /<repo>, so the app must know its base.
          # For a user site (<user>.github.io) set this to an empty string.
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Bundle budget
        run: node scripts/check-bundle-size.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
