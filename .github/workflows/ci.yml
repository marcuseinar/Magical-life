name: CI

# Every push and every pull request is checked. Publishing is decided per event:
# the default branch goes to production, a pull request gets its own preview.
#
# Branches are checked through their pull request, not through their pushes.
# Running on both produced two runs per commit; the concurrency rule below
# cancelled one, and the cancelled check runs stayed on the commit — showing as
# failures on the pull request and leaving it permanently "unstable", which a
# branch ruleset requiring these checks would also trip over.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed on the branch, so pushing twice in quick succession supersedes rather
  # than queues.
  group: ci-${{ github.head_ref || github.ref_name }}
  # Literal rather than the env below: workflow-level keys cannot read `env`.
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

permissions:
  contents: read

env:
  # The branch production is published from. Change here and in the concurrency
  # expression above together.
  PRODUCTION_BRANCH: main

jobs:
  verify:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fastest feedback first.
      - name: Types
        run: npm run check
      - name: Lint, formatting and design tokens
        run: npm run lint
      - name: Unit, property and component tests
        run: npm run test:coverage

  signalling-worker:
    name: Signalling worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/signalling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/signalling/package-lock.json
      - run: npm ci
      - name: Types
        run: npm run check
      - name: Tests (real Workers runtime, incl. the Durable Object)
        run: npm run test
      - name: Deploy config is valid
        run: npx wrangler deploy --dry-run

  e2e:
    name: User journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Signalling worker's own dependencies (wrangler dev, for table-connection specs)
        run: npm ci
        working-directory: workers/signalling
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end, accessibility and the monkey walk
        run: npm run test:e2e
      - name: Served from a subdirectory, as GitHub Pages does
        run: npm run test:e2e:base-path
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    # A pull request from a fork has no write token, so it cannot publish.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # publish-pages.sh commits onto gh-pages; a shallow clone cannot.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Decide where this build belongs
        id: target
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "base=/$REPO/pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "$PRODUCTION_BRANCH" ]; then
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "base=/$REPO" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # A branch with no pull request is built and measured, not published.
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "base=/$REPO" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.target.outputs.base }}
          # The signalling worker's URL (workers/signalling/), set as a
          # repository variable once it's deployed. Unset is fine — the
          # short-code join path just falls back to a pasted code instead.
          VITE_SIGNALLING_URL: ${{ vars.SIGNALLING_URL }}
          # A small, non-interactive version tag in the corner of the app —
          # the fast way to confirm a device is actually on the build you
          # think it is, rather than a cached or stale one.
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Bundle budget
        run: node scripts/check-bundle-size.mjs

      - name: Publish
        if: steps.target.outputs.publish == 'true'
        run: scripts/publish-pages.sh ${{ steps.target.outputs.dir }}

      - name: Link the preview on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/
        run: |
          BODY=$(printf '%s\n\n%s\n\n%s' \
            'Testable build of this pull request:' \
            "$PREVIEW" \
            'Rebuilt on every push, removed when this pull request closes.')
          gh pr comment "${{ github.event.number }}" --edit-last --body "$BODY" \
            || gh pr comment "${{ github.event.number }}" --body "$BODY"
