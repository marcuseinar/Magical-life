name: CI

# Every push and every pull request is checked. Publishing is decided per event:
# the default branch goes to production, a pull request gets its own preview.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed on the branch, so a push and its pull request share one run.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != github.event.repository.default_branch }}

permissions:
  contents: read

jobs:
  verify:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fastest feedback first.
      - name: Types
        run: npm run check
      - name: Lint, formatting and design tokens
        run: npm run lint
      - name: Unit, property and component tests
        run: npm run test:coverage

  e2e:
    name: User journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end, accessibility and the monkey walk
        run: npm run test:e2e
      - name: Served from a subdirectory, as GitHub Pages does
        run: npm run test:e2e:base-path
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    # A pull request from a fork has no write token, so it cannot publish.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # publish-pages.sh commits onto gh-pages; a shallow clone cannot.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Decide where this build belongs
        id: target
        env:
          REPO: ${{ github.event.repository.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "base=/$REPO/pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "$DEFAULT_BRANCH" ]; then
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "base=/$REPO" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # A branch with no pull request is built and measured, not published.
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "base=/$REPO" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.target.outputs.base }}

      - name: Bundle budget
        run: node scripts/check-bundle-size.mjs

      - name: Publish
        if: steps.target.outputs.publish == 'true'
        run: scripts/publish-pages.sh ${{ steps.target.outputs.dir }}

      - name: Link the preview on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/
        run: |
          BODY=$(printf '%s\n\n%s\n\n%s' \
            'Testable build of this pull request:' \
            "$PREVIEW" \
            'Rebuilt on every push, removed when this pull request closes.')
          gh pr comment "${{ github.event.number }}" --edit-last --body "$BODY" \
            || gh pr comment "${{ github.event.number }}" --body "$BODY"
