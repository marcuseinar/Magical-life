name: Remove preview

# A closed pull request should stop occupying a public URL.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  remove:
    name: Remove preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/remove-preview.sh "pr-${{ github.event.number }}"
